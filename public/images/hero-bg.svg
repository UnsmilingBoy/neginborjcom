<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#0F172A"/>
  <!-- Steel beam pattern -->
  <g opacity="0.15">
    <rect x="100" y="200" width="800" height="30" fill="#475569"/>
    <rect x="100" y="200" width="30" height="600" fill="#475569"/>
    <rect x="870" y="200" width="30" height="600" fill="#475569"/>
    <rect x="100" y="770" width="800" height="30" fill="#475569"/>
    <!-- Diagonal bracing -->
    <line x1="130" y1="230" x2="870" y2="770" stroke="#475569" stroke-width="8"/>
    <line x1="870" y1="230" x2="130" y2="770" stroke="#475569" stroke-width="8"/>
  </g>
  <g opacity="0.1">
    <rect x="1000" y="100" width="800" height="30" fill="#F59E0B"/>
    <rect x="1000" y="100" width="30" height="400" fill="#F59E0B"/>
    <rect x="1770" y="100" width="30" height="400" fill="#F59E0B"/>
    <rect x="1000" y="470" width="800" height="30" fill="#F59E0B"/>
  </g>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0.95"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#grad)"/>
</svg>
