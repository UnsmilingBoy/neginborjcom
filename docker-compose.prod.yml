services:
  postgres:
    image: postgres:16-alpine
    container_name: negin-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: neginborj
      POSTGRES_USER: negin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negin_secret_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negin -d neginborj"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: negin-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URI: postgresql://negin:${POSTGRES_PASSWORD:-negin_secret_prod}@postgres:5432/neginborj
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://neginborj.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      RFQ_EMAIL_TO: ${RFQ_EMAIL_TO}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_prod:
